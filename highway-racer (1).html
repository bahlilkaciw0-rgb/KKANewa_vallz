<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Highway Racer Realistis 3D</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif}
body{overflow:hidden;background:#0a0a0f;color:#fff;user-select:none;touch-action:none}
#canvas-container{width:100vw;height:100vh;display:block}
#intro-screen{position:fixed;inset:0;background:radial-gradient(circle at center,#1b2234 0%,#090b10 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;text-align:center;padding:20px}
#intro-screen h1{font-size:3rem;letter-spacing:3px;text-transform:uppercase;margin-bottom:10px;color:#00d2ff;text-shadow:0 0 20px rgba(0,210,255,.5)}
#intro-screen p{color:#a0aec0;margin-bottom:30px;font-size:1.1rem}
.btn-start{padding:15px 45px;font-size:1.2rem;font-weight:bold;color:#fff;background:linear-gradient(45deg,#0072ff,#00c6ff);border:none;border-radius:30px;cursor:pointer;box-shadow:0 5px 25px rgba(0,198,255,.4);transition:transform .2s}
.btn-start:hover{transform:scale(1.05)}
#hud{position:fixed;inset:0;pointer-events:none;display:none}
.top-bar{position:absolute;top:20px;left:20px;right:20px;display:flex;justify-content:space-between;background:rgba(10,15,25,.65);backdrop-filter:blur(8px);padding:12px 24px;border-radius:12px;border:1px solid rgba(255,255,255,.1)}
.stat-box span{display:block;font-size:.75rem;color:#94a3b8;text-transform:uppercase}.stat-box strong{font-size:1.4rem;color:#f8fafc}
.dashboard{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:25px;background:rgba(12,14,20,.85);padding:15px 35px;border-radius:50px;border:2px solid #2d3748;box-shadow:0 10px 30px rgba(0,0,0,.8)}
.gauge{text-align:center;min-width:90px}.gauge-val{font-size:2.2rem;font-weight:800;color:#38bdf8;font-variant-numeric:tabular-nums}.gauge-label{font-size:.7rem;color:#94a3b8;letter-spacing:1px}
.gear-indicator{width:48px;height:48px;border-radius:50%;border:2px solid #f59e0b;display:flex;align-items:center;justify-content:center;font-size:1.2rem;font-weight:bold;color:#f59e0b}
.controls-hint{position:absolute;bottom:115px;width:100%;text-align:center;color:rgba(255,255,255,.5);font-size:.85rem}
.pedals{position:absolute;bottom:25px;right:30px;display:flex;gap:15px;pointer-events:auto}
.pedal{width:55px;height:85px;border-radius:8px;border:2px solid #4a5568;background:rgba(30,41,59,.8);color:#fff;font-weight:bold;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px}
.pedal.on,.pedal:active{background:#38bdf8;color:#000}
.steer-btns{position:absolute;bottom:25px;left:30px;display:flex;gap:15px;pointer-events:auto}
.steer-btn{width:65px;height:65px;border-radius:50%;border:2px solid #4a5568;background:rgba(30,41,59,.8);color:#fff;font-size:1.5rem;cursor:pointer}
.steer-btn.on,.steer-btn:active{background:#38bdf8;color:#000}
#game-over{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:30}
#game-over h2{font-size:2.5rem;color:#ef4444;margin-bottom:10px}#final-score{font-size:1.3rem;margin-bottom:25px}
@media(max-width:700px){.dashboard{gap:10px;padding:10px 16px;bottom:100px}.controls-hint{display:none}}
</style>
</head>
<body>
<div id="intro-screen"><h1>Highway Racer Pro 3D</h1><p>Simulasi Lalu Lintas Jalan Tol Realistis</p><button class="btn-start" onclick="startGame()">MULAI MENGEMUDI</button></div>
<div id="hud">
  <div class="top-bar">
    <div class="stat-box"><span>Skor</span><strong id="score">0</strong></div>
    <div class="stat-box"><span>Near Miss</span><strong id="nearmiss">0x</strong></div>
    <div class="stat-box"><span>Jarak</span><strong id="distance">0.0 km</strong></div>
  </div>
  <div class="controls-hint">Panah / WASD: gas, rem, belok • Space: rem • Shift: nitro</div>
  <div class="steer-btns"><button class="steer-btn" id="btn-left">◀</button><button class="steer-btn" id="btn-right">▶</button></div>
  <div class="dashboard">
    <div class="gauge"><div class="gauge-val" id="rpm">1.0</div><div class="gauge-label">RPM x1000</div></div>
    <div class="gear-indicator" id="gear">D1</div>
    <div class="gauge"><div class="gauge-val" id="speed">0</div><div class="gauge-label">KM/H</div></div>
  </div>
  <div class="pedals"><button class="pedal" id="btn-brake">REM</button><button class="pedal" id="btn-gas">GAS</button></div>
</div>
<div id="game-over"><h2>TABRAKAN!</h2><p id="final-score">Skor Akhir: 0</p><button class="btn-start" onclick="resetGame()">MAIN LAGI</button></div>
<div id="canvas-container"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
let scene,camera,renderer,playerCar,clock;
let roadLines=[],traffic=[],buildings=[];
let isPlaying=false,score=0,distance=0,nearMissCount=0,speed=0,maxSpeed=260,targetX=0,curX=0,roll=0,spawnT=0;
const keys={left:false,right:false,up:false,down:false,nitro:false};
const LANES=[-6,-2,2,6],COLORS=[0xdc2626,0xeab308,0xf8fafc,0x2563eb,0x475569],$=id=>document.getElementById(id);

function init3D(){
  if(typeof THREE==='undefined'){$('intro-screen').querySelector('p').textContent='Gagal memuat Three.js — pastikan internet aktif lalu muat ulang.';return false}
  scene=new THREE.Scene();scene.background=new THREE.Color(0x0b101d);scene.fog=new THREE.FogExp2(0x0b101d,0.012);
  camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,0.1,200);
  renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
  $('canvas-container').appendChild(renderer.domElement);clock=new THREE.Clock();
  scene.add(new THREE.AmbientLight(0x405070,1.2));scene.add(new THREE.HemisphereLight(0x9fb8ff,0x202020,.9));
  const dl=new THREE.DirectionalLight(0xaaccff,1.5);dl.position.set(10,25,10);scene.add(dl);
  const road=new THREE.Mesh(new THREE.PlaneGeometry(16,400),new THREE.MeshStandardMaterial({color:0x1a1d24,roughness:.4,metalness:.2}));
  road.rotation.x=-Math.PI/2;road.position.z=-150;scene.add(road);
  const ground=new THREE.Mesh(new THREE.PlaneGeometry(200,400),new THREE.MeshStandardMaterial({color:0x0d1410,roughness:1}));
  ground.rotation.x=-Math.PI/2;ground.position.set(0,-0.05,-150);scene.add(ground);
  const rg=new THREE.BoxGeometry(.4,.8,400),rm=new THREE.MeshStandardMaterial({color:0x64748b,metalness:.7,roughness:.3});
  [-8.2,8.2].forEach(x=>{const r=new THREE.Mesh(rg,rm);r.position.set(x,.4,-150);scene.add(r)});
  const lg=new THREE.PlaneGeometry(.2,4),lm=new THREE.MeshBasicMaterial({color:0xffffff});
  for(let z=10;z>-300;z-=12)[-4,0,4].forEach(x=>{const l=new THREE.Mesh(lg,lm);l.rotation.x=-Math.PI/2;l.position.set(x,.02,z);scene.add(l);roadLines.push(l)});
  // gedung & lampu jalan di sisi jalan (bergerak, dipakai ulang)
  const bm=new THREE.MeshStandardMaterial({color:0x1b2436,roughness:.8});
  for(let i=0;i<40;i++){const h=6+Math.random()*30,b=new THREE.Mesh(new THREE.BoxGeometry(6+Math.random()*6,h,8),bm);
    const side=i%2?1:-1;b.position.set(side*(16+Math.random()*14),h/2,-i*8);scene.add(b);buildings.push(b)}
  playerCar=createRoadster();scene.add(playerCar);
  addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
  return true;
}

// Mobil sport listrik 2 pintu bergaya roadster (model prosedural orisinal, tanpa logo/merek)
function createRoadster(colorHex=0xc4121c){
  const car=new THREE.Group();
  const paint=new THREE.MeshPhysicalMaterial({color:colorHex,metalness:.65,roughness:.22,clearcoat:1,clearcoatRoughness:.08});
  // siluet samping (x = panjang, depan di x negatif; y = tinggi), lalu di-extrude jadi lebar bodi
  const s=new THREE.Shape();
  s.moveTo(-1.95,.42);
  s.quadraticCurveTo(-2.0,.62,-1.7,.7);      // hidung rendah
  s.quadraticCurveTo(-1.0,.78,-.55,.9);      // kap mesin naik ke kaca depan
  s.lineTo(.5,.9);
  s.quadraticCurveTo(1.3,.9,1.8,.88);        // dek belakang
  s.quadraticCurveTo(2.0,.85,2.0,.62);       // ekor
  s.lineTo(1.95,.42);
  s.lineTo(-1.95,.42);
  const geo=new THREE.ExtrudeGeometry(s,{depth:1.45,bevelEnabled:true,bevelSize:.16,bevelThickness:.2,bevelSegments:5,curveSegments:16});
  geo.rotateY(-Math.PI/2);geo.translate(.725,-.18,0);
  const body=new THREE.Mesh(geo,paint);car.add(body);
  // kabin kaca (atap kaca ala targa)
  const glassMat=new THREE.MeshPhysicalMaterial({color:0x0a121c,metalness:.9,roughness:.05,transparent:true,opacity:.82});
  const dome=new THREE.Mesh(new THREE.SphereGeometry(1,24,12,0,Math.PI*2,0,Math.PI/2),glassMat);
  dome.scale.set(.74,.42,1.05);dome.position.set(0,.8,.18);car.add(dome);
  // dua kursi + sandaran kepala
  const seatMat=new THREE.MeshStandardMaterial({color:0x151515,roughness:.8});
  [-.38,.38].forEach(x=>{const st=new THREE.Mesh(new THREE.BoxGeometry(.4,.28,.3),seatMat);st.position.set(x,.88,.5);car.add(st)});
  // lampu depan LED tipis & lampu belakang strip
  const fm=new THREE.MeshBasicMaterial({color:0xe6f4ff});
  [-.55,.55].forEach(x=>{const l=new THREE.Mesh(new THREE.BoxGeometry(.5,.05,.08),fm);l.position.set(x,.57,-2.14);l.rotation.y=x<0?.15:-.15;car.add(l)});
  const tail=new THREE.MeshBasicMaterial({color:0xb01010});
  const bar=new THREE.Mesh(new THREE.BoxGeometry(1.55,.06,.06),tail);bar.position.set(0,.66,2.2);car.add(bar);
  // difuser & lip depan
  const dark=new THREE.MeshStandardMaterial({color:0x0d0d0d,roughness:.5});
  const dif=new THREE.Mesh(new THREE.BoxGeometry(1.5,.1,.35),dark);dif.position.set(0,.3,2.0);car.add(dif);
  const lip=new THREE.Mesh(new THREE.BoxGeometry(1.7,.06,.3),dark);lip.position.set(0,.25,-1.95);car.add(lip);
  // roda: ban + velg perak (dibungkus pivot supaya bisa berputar)
  const tyre=new THREE.CylinderGeometry(.35,.35,.3,24),rim=new THREE.CylinderGeometry(.24,.24,.32,12);
  const tm=new THREE.MeshStandardMaterial({color:0x0b0b0b,roughness:.9}),rmat=new THREE.MeshStandardMaterial({color:0xc9ced6,metalness:.9,roughness:.2});
  const wheels=[];
  [[-.9,-1.3],[.9,-1.3],[-.9,1.3],[.9,1.3]].forEach(p=>{const g=new THREE.Group();g.position.set(p[0],.35,p[1]);
    const t=new THREE.Mesh(tyre,tm),r=new THREE.Mesh(rim,rmat);t.rotation.z=r.rotation.z=Math.PI/2;g.add(t,r);car.add(g);wheels.push(g)});
  car.userData={tail,wheels};
  const spot=new THREE.SpotLight(0xffffff,2,60,Math.PI/5,.5);spot.position.set(0,.8,-2);spot.target.position.set(0,0,-25);car.add(spot,spot.target);
  return car;
}

function createTrafficMesh(colorHex,isPlayer=false){
  const car=new THREE.Group();
  const body=new THREE.Mesh(new THREE.BoxGeometry(1.9,.85,4.3),new THREE.MeshStandardMaterial({color:colorHex,metalness:.6,roughness:.25}));body.position.y=.65;car.add(body);
  const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.6,.65,2.3),new THREE.MeshStandardMaterial({color:0x0f172a,metalness:.9,roughness:.1}));cabin.position.set(0,1.35,-.2);car.add(cabin);
  const lg=new THREE.BoxGeometry(.4,.18,.1),fm=new THREE.MeshBasicMaterial({color:0xe0f2fe}),rm=new THREE.MeshBasicMaterial({color:0xff1e1e});
  [-.65,.65].forEach(x=>{const fl=new THREE.Mesh(lg,fm);fl.position.set(x,.7,-2.16);const rl=new THREE.Mesh(lg,rm);rl.position.set(x,.75,2.16);car.add(fl,rl)});
  const wg=new THREE.CylinderGeometry(.38,.38,.3,14),wm=new THREE.MeshStandardMaterial({color:0x0a0a0a});
  [[-.95,-1.4],[.95,-1.4],[-.95,1.4],[.95,1.4]].forEach(p=>{const w=new THREE.Mesh(wg,wm);w.rotation.z=Math.PI/2;w.position.set(p[0],.38,p[1]);car.add(w)});
  if(isPlayer){const spot=new THREE.SpotLight(0xffffff,2,60,Math.PI/5,.5);spot.position.set(0,1,-2);spot.target.position.set(0,0,-25);car.add(spot,spot.target)}
  return car;
}

function spawnTraffic(z){
  const lane=LANES[Math.floor(Math.random()*4)];
  if(traffic.some(t=>t.mesh.position.x===lane&&Math.abs(t.mesh.position.z-z)<18))return;
  const m=createTrafficMesh(COLORS[Math.floor(Math.random()*COLORS.length)]);
  m.position.set(lane,0,z);scene.add(m);traffic.push({mesh:m,v:50+Math.random()*50,passed:false});
}

function startGame(){
  if(!renderer&&!init3D())return;
  $('intro-screen').style.display='none';$('hud').style.display='block';resetGame();
  if(!startGame.loop){startGame.loop=1;clock.start();requestAnimationFrame(loop)}
}
function resetGame(){
  $('game-over').style.display='none';
  traffic.forEach(t=>scene.remove(t.mesh));traffic=[];
  score=0;distance=0;nearMissCount=0;speed=60;targetX=curX=0;roll=0;spawnT=0;isPlaying=true;
  for(let i=1;i<=8;i++)spawnTraffic(-i*28-30);
}
function gameOver(){
  isPlaying=false;$('final-score').textContent='Skor Akhir: '+Math.floor(score)+' • Near miss: '+nearMissCount+'x • '+distance.toFixed(1)+' km';
  $('game-over').style.display='flex';
}

function update(dt){
  // gas / rem / nitro
  const nit=keys.nitro&&speed>60;
  if(keys.up)speed+=(nit?85:48)*(1-speed/(nit?maxSpeed*1.15:maxSpeed))*dt*2;
  else speed-=6*dt;
  if(keys.down)speed-=90*dt;
  speed=Math.max(0,Math.min(speed,maxSpeed*1.15));
  // belok halus, makin sempit saat ngebut
  const dir=(keys.right?1:0)-(keys.left?1:0);
  targetX=Math.max(-6.5,Math.min(6.5,targetX+dir*(6+speed*.03)*dt));
  curX+=(targetX-curX)*Math.min(1,dt*7);
  roll+=((-dir*.06*Math.min(1,speed/80))-roll)*Math.min(1,dt*6);
  playerCar.position.set(curX,0,0);playerCar.rotation.z=roll;playerCar.rotation.y=-(targetX-curX)*.12;
  const mps=speed/3.6;playerCar.userData.wheels.forEach(w=>w.rotation.x-=mps*dt/.35);playerCar.userData.tail.color.setHex(keys.down?0xff4040:0xb01010);
  roadLines.forEach(l=>{l.position.z+=mps*dt;if(l.position.z>12)l.position.z-=300});
  buildings.forEach(b=>{b.position.z+=mps*dt;if(b.position.z>20){b.position.z-=320;b.position.x=(b.position.x<0?-1:1)*(16+Math.random()*14)}});
  // lalu lintas
  spawnT-=dt;if(spawnT<=0&&traffic.length<14){spawnTraffic(-220-Math.random()*40);spawnT=.5+Math.random()*1.2}
  for(let i=traffic.length-1;i>=0;i--){
    const t=traffic[i],m=t.mesh;m.position.z+=(speed-t.v)/3.6*dt;
    const dx=Math.abs(m.position.x-curX),dz=Math.abs(m.position.z);
    if(dx<1.85&&dz<4.2){gameOver();return}
    if(!t.passed&&m.position.z>3&&dx<3.4&&dx>=1.85&&speed>80){t.passed=true;nearMissCount++;score+=100+speed}
    if(m.position.z>40||m.position.z<-260){scene.remove(m);traffic.splice(i,1)}
  }
  distance+=mps*dt/1000;score+=mps*dt*.5*(1+nearMissCount*.02);
  // kamera: menjauh & FOV melebar saat cepat
  const k=speed/maxSpeed;camera.fov+=((65+k*22)-camera.fov)*Math.min(1,dt*3);camera.updateProjectionMatrix();
  camera.position.set(curX*.7,3.2+k*.3+(nit?.2:0),6.5+k*1.2);camera.lookAt(curX*.5,1.2,-10);
  // HUD
  const g=Math.min(6,1+Math.floor(speed/42)),within=(speed-(g-1)*42)/42;
  const rpm=speed<2?1:g==6?Math.min(7.5,3+speed/45):1.6+Math.max(0,within)*5.2;
  $('score').textContent=Math.floor(score);$('nearmiss').textContent=nearMissCount+'x';$('distance').textContent=distance.toFixed(1)+' km';
  $('speed').textContent=Math.round(speed);$('rpm').textContent=rpm.toFixed(1);$('gear').textContent=speed<2?'N':'D'+g;
}

function loop(){
  requestAnimationFrame(loop);const dt=Math.min(.05,clock.getDelta());
  if(isPlaying)update(dt);renderer.render(scene,camera);
}

// kontrol
const map={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',Space:'down',ShiftLeft:'nitro',ShiftRight:'nitro'};
addEventListener('keydown',e=>{if(map[e.code]){keys[map[e.code]]=true;e.preventDefault()}});
addEventListener('keyup',e=>{if(map[e.code])keys[map[e.code]]=false});
[['btn-left','left'],['btn-right','right'],['btn-gas','up'],['btn-brake','down']].forEach(([id,k])=>{
  const b=$(id),on=e=>{e.preventDefault();keys[k]=true;b.classList.add('on')},off=e=>{e.preventDefault();keys[k]=false;b.classList.remove('on')};
  b.addEventListener('pointerdown',on);['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,off));
});
</script>
</body>
</html>
